server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Demo conceptual: no debe indexarse. El <meta robots> ya lo pide, este
    # header lo refuerza para crawlers que solo miran cabeceras.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # SPA: cualquier ruta desconocida devuelve el index, no un 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre: se pueden cachear a largo plazo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
